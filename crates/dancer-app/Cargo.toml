[package]
name = "dancer-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "dancer-rs"
path = "src/main.rs"

[dependencies]
dancer-analyze = { path = "../dancer-analyze" }
dancer-yandex = { path = "../dancer-yandex", optional = true }
dancer-choreo = { path = "../dancer-choreo" }
dancer-clock = { path = "../dancer-clock" }
dancer-render = { path = "../dancer-render" }
dancer-score = { path = "../dancer-score" }
dancer-source = { path = "../dancer-source" }
dancer-sprite = { path = "../dancer-sprite" }
anyhow.workspace = true
crossbeam-channel.workspace = true
serde.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
winit.workspace = true
windows.workspace = true
tokio = { version = "1", features = ["rt"], optional = true }
tray-icon = { version = "0.24", default-features = false }

[features]
# On by default because it is the only path that gives a streamed track a grid.
# Off is a supported configuration: yamuse wraps an undocumented API, and a break
# there must never be able to take the binary down (spec §6.4).
default = ["yandex"]
yandex = ["dep:dancer-yandex", "dep:tokio"]

[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/shmutalov/dancer-rs"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
crossbeam-channel = "0.5"
# `bundled` compiles SQLite from source: ~53 s once, no system dependency, and
# no version skew across machines. Spec §5.2 for why SQLite over an embedded KV.
rusqlite = { version = "0.40", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
winit = "0.30"
raw-window-handle = "0.6"

[workspace.dependencies.windows]
version = "0.62"
features = [
    # WinRT: SMTC (spec §6.2). Phase 0.5 proved these work on the GNU toolchain.
    "Foundation",
    "Foundation_Collections",
    "Media_Control",
    "Win32_Foundation",
    # CreateFileW is gated behind Win32_Security, for CONOUT$.
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
]

[profile.release]
opt-level = 3
lto = "thin"
